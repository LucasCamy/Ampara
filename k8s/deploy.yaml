apiVersion: v1
kind: Namespace
metadata:
  name: ampara
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ampara-db-pvc
  namespace: ampara
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: ampara
spec:
  type: ClusterIP
  selector:
    app: ampara-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: ampara
spec:
  type: ClusterIP
  selector:
    app: ampara-auth
  ports:
    - name: http
      port: 9999
      targetPort: 9999
---
apiVersion: v1
kind: Service
metadata:
  name: rest
  namespace: ampara
spec:
  type: ClusterIP
  selector:
    app: ampara-rest
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: ampara-web
  namespace: ampara
spec:
  type: LoadBalancer
  selector:
    app: ampara-web
  ports:
    - name: http
      port: 8217
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ampara-db
  namespace: ampara
  labels:
    app: ampara-db
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ampara-db
  template:
    metadata:
      labels:
        app: ampara-db
    spec:
      containers:
        - name: db
          image: supabase/postgres:15.8.1.085
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ampara-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ampara-secrets
                  key: JWT_SECRET
            - name: POSTGRES_HOST
              value: /var/run/postgresql
            - name: POSTGRES_DB
              value: postgres
            - name: JWT_EXP
              value: "3600"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -h
                - localhost
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -h
                - localhost
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: sql
              mountPath: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
              subPath: 99-roles.sql
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ampara-db-pvc
        - name: sql
          configMap:
            name: ampara-sql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ampara-auth
  namespace: ampara
  labels:
    app: ampara-auth
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ampara-auth
  template:
    metadata:
      labels:
        app: ampara-auth
    spec:
      initContainers:
        - name: wait-db
          image: supabase/postgres:15.8.1.085
          command:
            - sh
            - -c
            - |
              until pg_isready -U postgres -h db; do
                echo "Aguardando Postgres (db:5432)..."
                sleep 2
              done
      containers:
        - name: auth
          image: supabase/gotrue:v2.177.0
          ports:
            - containerPort: 9999
              name: http
          env:
            - name: GOTRUE_API_HOST
              value: "0.0.0.0"
            - name: GOTRUE_API_PORT
              value: "9999"
            - name: API_EXTERNAL_URL
              value: "https://ampara.cloudlane.com.br"
            - name: GOTRUE_SITE_URL
              value: "https://ampara.cloudlane.com.br"
            - name: GOTRUE_URI_ALLOW_LIST
              value: "*"
            - name: GOTRUE_DB_DRIVER
              value: postgres
            - name: GOTRUE_DB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ampara-secrets
                  key: GOTRUE_DB_DATABASE_URL
            # Cadastro fechado: o app é só do casal. Para criar uma conta nova (ex.: o par entrando pela primeira vez),
            # mude para "false", aplique, crie a conta e volte para "true".
            - name: GOTRUE_DISABLE_SIGNUP
              value: "false"
            - name: GOTRUE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ampara-secrets
                  key: JWT_SECRET
            - name: GOTRUE_JWT_EXP
              value: "3600"
            - name: GOTRUE_JWT_AUD
              value: authenticated
            - name: GOTRUE_JWT_DEFAULT_GROUP_NAME
              value: authenticated
            - name: GOTRUE_JWT_ADMIN_ROLES
              value: service_role
            - name: GOTRUE_EXTERNAL_EMAIL_ENABLED
              value: "true"
            - name: GOTRUE_EXTERNAL_PHONE_ENABLED
              value: "false"
            - name: GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED
              value: "false"
            - name: GOTRUE_MAILER_AUTOCONFIRM
              value: "true"
          resources:
            requests:
              cpu: 15m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ampara-rest
  namespace: ampara
  labels:
    app: ampara-rest
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ampara-rest
  template:
    metadata:
      labels:
        app: ampara-rest
    spec:
      # O schema não é mais aplicado aqui: o backend (ampara-push) aplica o supabase/schema.sql da própria imagem
      # a cada versão nova e avisa o PostgREST. Um ConfigMap antigo reaplicado aqui desfaria políticas novas.
      containers:
        - name: rest
          image: postgrest/postgrest:v12.2.12
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PGRST_DB_URI
              valueFrom:
                secretKeyRef:
                  name: ampara-secrets
                  key: PGRST_DB_URI
            - name: PGRST_DB_SCHEMAS
              value: public
            - name: PGRST_DB_ANON_ROLE
              value: anon
            - name: PGRST_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ampara-secrets
                  key: JWT_SECRET
            - name: PGRST_DB_USE_LEGACY_GUCS
              value: "false"
          resources:
            requests:
              cpu: 15m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ampara-web
  namespace: ampara
  labels:
    app: ampara-web
  annotations:
    keel.sh/policy: "force"
    keel.sh/trigger: "poll"
    keel.sh/pollSchedule: "@every 1m"
    keel.sh/match-tag: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ampara-web
  template:
    metadata:
      labels:
        app: ampara-web
    spec:
      containers:
        - name: web
          image: ghcr.io/lucascamy/ampara:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
# Backend: ao subir aplica o supabase/schema.sql da imagem (só quando mudou, com trava) e depois roda os lembretes
# (Web Push). Sem porta exposta: lê o Postgres e chama os serviços de push
# dos navegadores. Gera as chaves VAPID na primeira vez (tabela push_config). Uma réplica basta; duas não
# duplicam envio (cada lembrete é reservado em push_sent antes de sair).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ampara-push
  namespace: ampara
  labels:
    app: ampara-push
  annotations:
    keel.sh/policy: "force"
    keel.sh/trigger: "poll"
    keel.sh/pollSchedule: "@every 1m"
    keel.sh/match-tag: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ampara-push
  template:
    metadata:
      labels:
        app: ampara-push
    spec:
      # Etapa 1 (senha de administrador): aplica o schema.sql da imagem e liga o login do papel ampara_worker.
      initContainers:
        - name: migrate
          image: ghcr.io/lucascamy/ampara-push:latest
          imagePullPolicy: Always
          args: ["node", "worker.mjs", "--migrate-only"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ampara-secrets
                  key: POSTGRES_PASSWORD
            - name: WORKER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ampara-secrets
                  key: WORKER_DB_PASSWORD
            # senhas sem caracteres especiais de URL (@ / : ?)
            - name: MIGRATE_DATABASE_URL
              value: "postgres://postgres:$(POSTGRES_PASSWORD)@db:5432/postgres"
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 300m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
      # Etapa 2: o worker nem recebe a senha de administrador. O papel ampara_worker só lê remédios, doses,
      # pedidos de ajuda e nomes (sem lançamentos, ciclo ou presentes; ver supabase/schema.sql, iteração 19).
      containers:
        - name: push
          image: ghcr.io/lucascamy/ampara-push:latest
          imagePullPolicy: Always
          env:
            - name: WORKER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ampara-secrets
                  key: WORKER_DB_PASSWORD
            - name: DATABASE_URL
              value: "postgres://ampara_worker:$(WORKER_DB_PASSWORD)@db:5432/postgres"
            - name: PUSH_SUBJECT
              value: "https://ampara.cloudlane.com.br"
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 150m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
---
# Backup diário do banco (03:30 de Brasília), 14 dias guardados. Restauração e cópia para fora do cluster:
# docs/BACKUP.md. Os comandos de dump são os mesmos que `npm run backup:check` ensaia (restaura num banco novo).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ampara-backup-pvc
  namespace: ampara
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ampara-backup
  namespace: ampara
spec:
  schedule: "30 3 * * *"
  timeZone: America/Sao_Paulo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: supabase/postgres:15.8.1.085
              imagePullPolicy: IfNotPresent
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ampara-secrets
                      key: POSTGRES_PASSWORD
                - name: PGHOST
                  value: db
                - name: KEEP
                  value: "14"
              command:
                - bash
                - -euc
                - |
                  TS=$(date -u +%Y-%m-%dT%H%M%SZ)
                  D="/backup/$TS.partial"
                  mkdir -p "$D"
                  # app (estrutura + dados + RLS) e contas (só os dados: a estrutura do auth é do GoTrue)
                  pg_dump -U postgres -d postgres -Fc -n public -n ampara_meta -f "$D/app.dump"
                  pg_dump -U postgres -d postgres -Fc --data-only -t auth.users -t auth.identities -f "$D/auth.dump"
                  (cd "$D" && sha256sum app.dump auth.dump > SHA256SUMS)
                  mv "$D" "/backup/$TS"
                  rm -rf /backup/*.partial
                  # guarda os KEEP mais recentes
                  ls -1d /backup/20*Z | sort | head -n "-$KEEP" | xargs -r rm -rf
                  echo "backup $TS: $(du -sh "/backup/$TS" | cut -f1); guardados: $(ls -1d /backup/20*Z | wc -l)"
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: ampara-backup-pvc
