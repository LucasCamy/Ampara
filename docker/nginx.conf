# Gateway local no lugar do Kong do Supabase: /auth/v1 -> GoTrue, /rest/v1 -> PostgREST, com CORS.
# Sem cookies (o app usa Authorization: Bearer), então origem "*" não abre CSRF.
events {}

http {
  server {
    listen 8000;
    client_max_body_size 2m;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Expose-Headers;

    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods 'GET, POST, PATCH, PUT, DELETE, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'apikey, authorization, content-type, prefer, x-client-info, accept-profile, content-profile' always;
    add_header Access-Control-Expose-Headers 'content-range' always;
    add_header Access-Control-Max-Age 3600 always;

    location /auth/v1/ {
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://auth:9999/;
    }

    location /rest/v1/ {
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://rest:3000/;
    }
  }
}
