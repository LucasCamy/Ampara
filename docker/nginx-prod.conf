# Ampara · Gateway de produção (PWA estático + proxy reverso /auth/v1 -> GoTrue e /rest/v1 -> PostgREST)
# Roda em nginxinc/nginx-unprivileged na porta 8080 (usuário não-root uid 101).

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  # Limite de tentativas por IP: login, cadastro, recuperação e entrada pelo convite (força bruta).
  # Atrás de um proxy/túnel todos podem chegar com o mesmo IP: o limite é folgado para o casal não esbarrar.
  # real_ip fica desligado de propósito: só ligue quando o que está na frente (túnel/proxy com TLS) SEMPRE
  # regrava o X-Forwarded-For. Senão qualquer um forja o cabeçalho e escapa do limite. Exemplo para Cloudflare
  # Tunnel (cloudflared dentro da rede):
  #   set_real_ip_from 10.0.0.0/8; set_real_ip_from 172.16.0.0/12; set_real_ip_from 192.168.0.0/16;
  #   real_ip_header CF-Connecting-IP;
  # HSTS: o navegador só aceita por HTTPS (acesso direto em http://IP:8217 não é afetado). Sem includeSubDomains
  # para não forçar HTTPS em outros serviços do mesmo domínio.
  limit_req_zone $binary_remote_addr zone=ampara_auth:10m rate=20r/m;
  limit_req_status 429;
  client_max_body_size 2m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Probe de saúde para Kubernetes (readiness/liveness) e Uptime Kuma
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # GoTrue: senha, cadastro e recuperação com limite de tentativas
    location ~ ^/auth/v1/(token|signup|recover|otp|verify)$ {
      limit_req zone=ampara_auth burst=20 nodelay;
      rewrite ^/auth/v1/(.*)$ /$1 break;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://auth:9999;
    }

    # Entrada pelo convite: mesmo limite (o código não pode ser adivinhado na força)
    location = /rest/v1/rpc/join_couple {
      limit_req zone=ampara_auth burst=10 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://rest:3000/rpc/join_couple;
    }

    # GoTrue (Supabase Auth)
    location /auth/v1/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://auth:9999/;
    }

    # PostgREST (Supabase REST + RPCs)
    location /rest/v1/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://rest:3000/;
    }

    # Assets com hash no nome: cache longo imutável
    location /assets/ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      try_files $uri =404;
    }

    # SPA fallback + service worker / manifest sempre frescos
    location / {
      add_header Cache-Control "no-cache" always;
      add_header X-Frame-Options "DENY" always;
      add_header Content-Security-Policy "frame-ancestors 'none'" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
